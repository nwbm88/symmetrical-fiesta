[package]
name = "clearwave"
version = "0.1.0"
description = "ClearWave — restore and remaster rough recordings, locally"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clearwave-engine = { path = "../engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
