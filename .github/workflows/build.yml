name: Build ClearWave

on:
  push:
    branches:
      - main
      - claude/audio-remaster-windows-app-2k4tg1
  workflow_dispatch:

jobs:
  test-engine:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run engine tests
        run: cargo test -p clearwave-engine --no-default-features --release

  test-ui:
    name: UI smoke tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ui-tests
        run: npm install
      - name: Install Chromium
        working-directory: ui-tests
        run: npx playwright install --with-deps chromium
      - name: Run UI smoke tests
        working-directory: ui-tests
        run: npm test

  build-windows:
    name: Windows installer
    runs-on: windows-latest
    needs: [test-engine, test-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli
      - name: Build installer
        run: tauri build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearWave-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: ClearWave-windows-portable
          path: target/release/clearwave.exe
          if-no-files-found: error
