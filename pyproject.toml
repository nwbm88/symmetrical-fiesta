[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "livearchiver"
version = "0.1.0"
description = "Search, download, deduplicate and track-split live recordings of any band from YouTube and the Internet Archive"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2025.1.1",
    "requests>=2.31",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
livearchiver = "livearchiver.cli:main"
livearchiver-gui = "livearchiver.gui:main_standalone"

[tool.setuptools.packages.find]
include = ["livearchiver*"]
