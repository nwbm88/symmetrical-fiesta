[package]
name = "clearwave-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["playback"]
playback = ["dep:cpal"]

[dependencies]
symphonia = { version = "0.5", features = ["all"] }
nnnoiseless = "0.5"
ebur128 = "0.1"
rubato = "0.16"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = { version = "0.16", optional = true }
